# ============================================
# TIME VAULT — nginx server block
# Isolated vhost: touches nothing else on the VPS.
#
# ⚠️  DO NOT copy this file over the live vhost.
# Once certbot has run it owns /etc/nginx/sites-available/timevault and adds a
# `listen 443 ssl` server block there. Overwriting the file deletes that block
# and takes HTTPS down (Cloudflare keeps serving cached pages, so the outage is
# easy to miss). This file is the FIRST-INSTALL template and a reference for
# what the vhost should contain; to change the live config, edit it in place or
# patch the specific block, then `nginx -t` before reloading.
#
# First install only:
#   Install to: /etc/nginx/sites-available/timevault
#   Enable:     ln -s /etc/nginx/sites-available/timevault /etc/nginx/sites-enabled/
#   Then run certbot, which adds the 443 block.
#
# The /api/lyra location below must live in the 443 block on the live server.
# It also needs server/nginx-lyra-zone.conf installed to
# /etc/nginx/conf.d/ (defines the limit_req zone).
# ============================================

server {
    listen 80;
    listen [::]:80;
    server_name timevault.tv www.timevault.tv;

    root /var/www/timevault;
    index index.html;

    # www -> apex (after certbot runs it will manage the 80->443 redirect)
    if ($host = www.timevault.tv) {
        return 301 https://timevault.tv$request_uri;
    }

    # Keep the address bar clean: explicit /index.html -> / (loop-safe via $request_uri)
    if ($request_uri ~ "^/index\.html") {
        return 301 /;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # LYRA agent backend (systemd: timevault-lyra). Second layer of abuse
    # protection — the service rate-limits per IP as well.
    location /api/lyra {
        limit_req zone=lyra burst=5 nodelay;
        limit_req_status 429;

        # Strip the /api/lyra prefix before proxying: the backend serves
        # /health and /chat at its root. (A bare proxy_pass URI would produce
        # a double slash: /api/lyra/health -> //health -> 404.)
        rewrite ^/api/lyra/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Model replies can take a few seconds; don't cut them off.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # Cache static assets aggressively (immutable filenames not used, so 7 days)
    location ~* \.(png|jpg|jpeg|webp|svg|mp4|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Basic security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
}
