# ============================================
# TIME VAULT: nginx server block
# Isolated vhost: touches nothing else on the VPS.
#
# WARNING: DO NOT copy this file over the live vhost.
# Once certbot has run it owns /etc/nginx/sites-available/timevault and adds a
# `listen 443 ssl` server block there. Overwriting the file deletes that block
# and takes HTTPS down (Cloudflare keeps serving cached pages, so the outage is
# easy to miss). This file is the FIRST-INSTALL template and a reference for
# what the vhost should contain; to change the live config, edit it in place or
# patch the specific block, then `nginx -t` before reloading.
#
# First install only:
#   Install to: /etc/nginx/sites-available/timevault
#   Enable:     ln -s /etc/nginx/sites-available/timevault /etc/nginx/sites-enabled/
#   Then run certbot, which adds the 443 block.
#
# The /api/lyra location below must live in the 443 block on the live server.
# It also needs server/nginx-lyra-zone.conf installed to
# /etc/nginx/conf.d/ (defines the limit_req zone).
# ============================================

server {
    listen 80;
    listen [::]:80;
    server_name timevault.tv www.timevault.tv;

    root /var/www/timevault;
    index index.html;

    # www -> apex (after certbot runs it will manage the 80->443 redirect)
    if ($host = www.timevault.tv) {
        return 301 https://timevault.tv$request_uri;
    }

    # Clean URLs. Any /name.html is redirected to /name (loop-safe: the target has
    # no .html so it cannot match again). Query strings are preserved.
    if ($request_uri ~ "^/index\.html") {
        return 301 /;
    }
    if ($request_uri ~ "^/([a-zA-Z0-9_-]+)\.html") {
        return 301 /$1$is_args$args;
    }

    location / {
        # $uri.html makes /app serve app.html and /whitepaper serve whitepaper.html.
        # The files stay at the document root, so relative asset paths keep working.
        try_files $uri $uri.html $uri/ =404;
    }

    # A wrong URL should still look like Time Vault rather than a bare nginx
    # page. 404.html uses absolute asset paths, so it renders correctly however
    # deep the address the visitor got wrong.
    error_page 404 /404.html;

    # Without this, try_files would find 404.html and serve the page with a
    # 200, which lies to crawlers. Returning 404 hands it to error_page instead.
    location = /404 {
        return 404;
    }

    # LYRA agent backend (systemd: timevault-lyra). Second layer of abuse
    # protection, since the service rate-limits per IP as well.
    location /api/lyra {
        limit_req zone=lyra burst=5 nodelay;
        limit_req_status 429;

        # Strip the /api/lyra prefix before proxying: the backend serves
        # /health and /chat at its root. (A bare proxy_pass URI would produce
        # a double slash: /api/lyra/health -> //health -> 404.)
        rewrite ^/api/lyra/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Model replies can take a few seconds; don't cut them off.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # Images, video and fonts change only when they are replaced by hand.
    # No add_header here on purpose: one add_header inside a location drops
    # every add_header inherited from the server block, which would quietly
    # strip the security headers below off every image the site serves.
    location ~* \.(png|jpg|jpeg|webp|svg|ico|mp4|woff2?)$ {
        expires 7d;
        access_log off;
    }

    # Scripts and styles ship on every deploy and carry no content hash, so a
    # long cache would serve yesterday's code. An hour is enough to help repeat
    # visits without outliving a release.
    location ~* \.(js|css)$ {
        expires 1h;
    }

    # Security headers. `always` so they survive error responses too.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Six months, and deliberately without `preload`: preload lists are painful
    # to leave, and this can be shortened again if the domain ever needs to.
    add_header Strict-Transport-Security "max-age=15768000" always;
    # The site asks for none of these, so nothing embedded in it can either.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    gzip on;
    # text/html is gzipped unconditionally; listing it here only makes nginx
    # warn about a duplicate MIME type on every config test.
    gzip_types text/css application/javascript application/json image/svg+xml;
}
