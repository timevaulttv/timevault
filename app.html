<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Vault ($TV) | App</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <meta name="description" content="Time Vault App: browse Service NFTs, mint your hours, track escrowed orders, and work with 7 AI agents. Every hour, sealed on chain.">
    <meta name="theme-color" content="#060309">
    <link rel="canonical" href="https://timevault.tv/app">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://timevault.tv/app">
    <meta property="og:site_name" content="Time Vault">
    <meta property="og:title" content="Time Vault App | AI-Powered Service Marketplace">
    <meta property="og:description" content="Browse Service NFTs, mint your hours, and let 7 AI agents handle escrow, pricing, and verification.">
    <meta property="og:image" content="https://timevault.tv/assets/og.png">
    <meta name="twitter:card" content="summary_large_image">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&family=Cinzel:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060309; --bg-elevated: #0C0713; --bg-surface: #140C1F;
            --violet: #8B5CF6; --violet-dim: #6D28D9; --magenta: #C026D3;
            --silver: #B9ABCE; --silver-dim: #8C7CA6; --silver-subtle: #665A7E;
            --white: #FAFAFA; --green: #34D399; --red: #F87171;
            --gold: #D4AF37; --gold-bright: #F0DA9B; --gold-deep: #8A6A1F;
            --gold-line: rgba(212, 175, 55, 0.28);
            --font-display: 'Cinzel', serif; --font-body: 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; background: var(--bg); }
        body { font-family: var(--font-body); background: var(--bg); color: var(--silver); line-height: 1.6; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.35); border-radius: 2px; }
        ::selection { background: rgba(139, 92, 246, 0.4); color: var(--white); }

        /* BACKGROUND CANVAS */
        #bg3d { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        /* GOLD FOIL FRAME */
        .gold-frame {
            padding: 1px; border-radius: 20px;
            background: linear-gradient(165deg, rgba(212, 175, 55, 0.6), rgba(212, 175, 55, 0.12) 28%, rgba(139, 92, 246, 0.4) 58%, rgba(192, 38, 211, 0.25) 78%, rgba(212, 175, 55, 0.5));
        }
        .gold-frame-inner {
            background: linear-gradient(180deg, #140B20, #0A0512); border-radius: 19px; padding: 2rem; height: 100%;
        }
        .gold-frame-sm { border-radius: 14px; }
        .gold-frame-sm .gold-frame-inner { border-radius: 13px; padding: 1.25rem; }

        /* GOLD EYEBROW */
        .gold-eyebrow {
            display: flex; align-items: center; gap: 0.75rem;
            font-family: var(--font-mono); font-size: 0.68rem; color: var(--gold);
            letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 0.75rem;
        }
        .gold-eyebrow::before { content: ''; width: 36px; height: 1px; background: linear-gradient(90deg, var(--gold), transparent); flex-shrink: 0; }

        /* GOLD METALLIC TEXT */
        .gold-text {
            background: linear-gradient(180deg, var(--gold-bright) 10%, var(--gold) 50%, var(--gold-deep) 95%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            font-weight: 700;
        }

        /* BUTTONS */
        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.75rem;
            border-radius: 100px; font-weight: 550; font-size: 0.88rem; cursor: pointer;
            transition: all 0.4s var(--ease-out); font-family: var(--font-body); border: none; text-decoration: none;
            letter-spacing: 0.02em;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--violet-dim), var(--magenta));
            color: var(--white); box-shadow: inset 0 0 0 1px var(--gold-line);
        }
        .btn-primary:hover { box-shadow: inset 0 0 0 2px rgba(212, 175, 55, 0.5), 0 0 24px rgba(139, 92, 246, 0.4); transform: translateY(-1px); }
        .btn-ghost { background: transparent; border: 1px solid rgba(255, 255, 255, 0.1); color: var(--silver); }
        .btn-ghost:hover { border-color: var(--gold-line); color: var(--white); }
        .btn-sm { padding: 0.45rem 1rem; font-size: 0.78rem; }

        /* STATUS */
        .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
        .status-green { background: var(--green); box-shadow: 0 0 6px rgba(52, 211, 153, 0.5); }
        .status-gold { background: var(--gold); box-shadow: 0 0 6px rgba(212, 175, 55, 0.5); }
        .status-red { background: var(--red); box-shadow: 0 0 6px rgba(248, 113, 113, 0.5); }
        .status-violet { background: var(--violet); box-shadow: 0 0 6px rgba(139, 92, 246, 0.5); animation: pulseViolet 1.5s infinite; }
        @keyframes pulseViolet { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* APP LAYOUT */
        .app-layout { display: flex; min-height: 100vh; padding-top: 0; position: relative; z-index: 1; }
        .app-sidebar {
            width: 250px; background: var(--bg-elevated); border-right: 1px solid rgba(255, 255, 255, 0.04);
            position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; display: flex; flex-direction: column;
            padding: 1.5rem 0; overflow-y: auto;
        }
        .app-main { margin-left: 250px; flex: 1; min-width: 0; max-width: calc(100vw - 250px); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        .app-topbar {
            padding: 1rem 2rem; background: rgba(6,3,9,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(212,175,55,0.12);
            display: flex; align-items: center; gap: 1.5rem; position: sticky; top: 0; z-index: 50;
        }
        .app-content { flex: 1; padding: 2rem; }

        /* SOCIAL LINKS (X + GitHub) */
        .tv-social { display: inline-flex; align-items: center; gap: 0.55rem; vertical-align: middle; }
        .tv-social a { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px;
            margin: 0; padding: 0; border-radius: 50%; color: var(--silver-dim); text-decoration: none;
            border: 1px solid rgba(212,175,55,0.16); background: rgba(255,255,255,0.02);
            transition: color 0.35s var(--ease-out), border-color 0.35s var(--ease-out), box-shadow 0.35s var(--ease-out), transform 0.35s var(--ease-out); }
        .tv-social a svg { width: 15px; height: 15px; fill: currentColor; display: block; }
        .tv-social a:hover, .tv-social a:focus-visible { color: var(--gold-bright); border-color: rgba(212,175,55,0.55);
            background: rgba(212,175,55,0.07); box-shadow: 0 0 18px rgba(212,175,55,0.22); transform: translateY(-2px); }
        .tv-social-sm a { width: 28px; height: 28px; }
        .tv-social-sm a svg { width: 13px; height: 13px; }
        @media (prefers-reduced-motion: reduce) { .tv-social a:hover, .tv-social a:focus-visible { transform: none; } }
        .app-topbar .tv-social { margin-left: 0.25rem; }
        .app-footer { padding: 1.75rem 2rem 2rem; text-align: center; border-top: 1px solid rgba(212,175,55,0.1); }
        .app-footer p { font-size: 0.7rem; color: var(--silver-subtle); font-family: var(--font-mono); letter-spacing: 0.06em; margin-bottom: 1rem; }
        @media (max-width: 640px) { .app-topbar .tv-social { display: none; } }

        /* Touch targets: see the note in whitepaper.html. Touch layouts only. */
        @media (max-width: 820px) {
            .app-footer .tv-social a { width: 44px; height: 44px; }
            .app-footer .tv-social a svg { width: 16px; height: 16px; }
            .app-footer .tv-social { gap: 0.8rem; }
        }
        .app-content.fade-in > * { animation: contentIn 0.5s var(--ease-out) both; }
        @keyframes contentIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background: radial-gradient(ellipse 60% 40% at 75% 0%, rgba(192,38,211,0.05), transparent 65%),
                        radial-gradient(ellipse 50% 45% at 20% 5%, rgba(139,92,246,0.07), transparent 70%); }

        /* SIDEBAR */
        .sidebar-brand { display: flex; align-items: center; gap: 0.6rem; padding: 0 1.25rem 1.4rem; text-decoration: none; border-bottom: 1px solid rgba(212,175,55,0.12); margin-bottom: 1rem; }
        .brand-emblem { height: 34px; width: auto; filter: drop-shadow(0 2px 10px rgba(139,92,246,0.5)); }
        .brand-wordmark { height: 16px; width: auto; }
        .nav-icon { width: 16px; height: 16px; flex-shrink: 0; }
        .sidebar-nav a.active .nav-icon { color: var(--gold); }
        .sidebar-nav { display: flex; flex-direction: column; gap: 0.1rem; padding: 0 0.75rem; flex: 1; }
        .sidebar-nav a {
            text-decoration: none; color: var(--silver-dim); padding: 0.7rem 1rem; border-radius: 8px;
            font-size: 0.82rem; font-weight: 450; transition: all 0.3s; display: flex; align-items: center; gap: 0.65rem;
            position: relative;
        }
        .sidebar-nav a:hover { color: var(--white); background: rgba(139, 92, 246, 0.06); }
        .sidebar-nav a.active { color: var(--white); background: linear-gradient(90deg, rgba(139, 92, 246, 0.12), transparent); box-shadow: inset 2px 0 0 var(--gold); font-weight: 550; }
        .sidebar-wallet { padding: 1rem 1.25rem; border-top: 1px solid rgba(255, 255, 255, 0.04); }
        .sidebar-wallet button {
            width: 100%; padding: 0.6rem 1rem; border-radius: 100px; font-weight: 500; font-size: 0.78rem;
            cursor: pointer; transition: all 0.3s; font-family: var(--font-body);
            background: transparent; border: 1px solid rgba(255, 255, 255, 0.12); color: var(--silver-dim);
            display: flex; align-items: center; justify-content: center; gap: 0.4rem;
        }
        .sidebar-wallet button.connected { background: rgba(52, 211, 153, 0.06); border-color: rgba(52, 211, 153, 0.25); color: var(--green); font-family: var(--font-mono); font-size: 0.72rem; }

        /* TOPBAR */
        .topbar-title { font-family: var(--font-display); font-size: 1.3rem; color: var(--white); font-weight: 600; }
        .topbar-spacer { flex: 1; }
        .topbar-price {
            display: flex; align-items: center; gap: 0.6rem; font-family: var(--font-mono);
            padding: 0.5rem 1.1rem; border-radius: 100px;
            background: rgba(139, 92, 246, 0.07); border: 1px solid var(--gold-line);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.1);
        }
        .topbar-price .tp-label { font-size: 0.68rem; color: var(--silver-subtle); letter-spacing: 0.1em; }
        .topbar-price .tp-value { font-size: 1.05rem; font-weight: 700; background: linear-gradient(180deg, var(--gold-bright) 10%, var(--gold) 50%, var(--gold-deep) 95%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .topbar-price .tp-chg { font-size: 0.68rem; font-weight: 600; padding: 0.15rem 0.5rem; border-radius: 100px; }
        .topbar-price .tp-chg.up { color: var(--green); background: rgba(52,211,153,0.1); }
        .topbar-price .tp-chg.down { color: var(--red); background: rgba(248,113,113,0.1); }

        /* LIVE FEED BAR */
        .live-bar {
            display: flex; align-items: center; gap: 1.1rem; padding: 0.65rem 2rem;
            background: linear-gradient(90deg, rgba(212,175,55,0.06), transparent 30%), rgba(10,5,18,0.9);
            backdrop-filter: blur(16px); border-bottom: 1px solid rgba(212,175,55,0.14);
            position: sticky; top: 62px; z-index: 45; overflow: hidden;
        }
        .live-badge {
            display: flex; align-items: center; gap: 0.45rem; flex-shrink: 0;
            font-family: var(--font-mono); font-size: 0.64rem; letter-spacing: 0.14em; color: var(--green);
            border: 1px solid rgba(52,211,153,0.3); background: rgba(52,211,153,0.07);
            padding: 0.28rem 0.8rem; border-radius: 100px;
        }
        .live-badge-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; animation: liveBlink 1.6s infinite; box-shadow: 0 0 8px rgba(52,211,153,0.7); }
        @keyframes liveBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .live-marquee { flex: 1; min-width: 0; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
        .live-track { display: inline-flex; gap: 3.5rem; white-space: nowrap; animation: tickerScroll 45s linear infinite; will-change: transform; }
        .live-bar:hover .live-track { animation-play-state: paused; }
        @keyframes tickerScroll { to { transform: translateX(-50%); } }
        .tk-item { font-family: var(--font-mono); font-size: 0.78rem; color: var(--silver); display: inline-flex; align-items: center; gap: 0.5rem; }
        .tk-item .tk-agent { font-weight: 600; letter-spacing: 0.04em; }
        .tk-item .tk-agent.gold { color: var(--gold); } .tk-item .tk-agent.green { color: var(--green); } .tk-item .tk-agent.violet { color: var(--violet); }
        .tk-item .tk-val { color: var(--white); font-weight: 500; }
        .tk-sep { color: var(--silver-subtle); opacity: 0.4; }
        @media (prefers-reduced-motion: reduce) { .live-track { animation: none; } }
        .topbar-ticker span { margin-right: 2rem; }

        /* The topbar runs title + price on one row. On a 375px handset that
           needs ~358px against 315px available, so the price badge was being
           clipped. Tighten the gutters, let the title ellipsize, and hold the
           price at its natural width so the number stays readable. */
        @media (max-width: 820px) {
            .app-topbar { padding: 0.8rem 0.75rem; gap: 0.55rem; }
            /* Hold the title at its natural width; the flexible spacer beside
               it absorbs the slack. Ellipsis only kicks in for a title long
               enough to genuinely crowd the price. */
            .topbar-title { font-size: 1.0rem; min-width: 0; max-width: 42vw;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .topbar-price { flex-shrink: 0; gap: 0.35rem; padding: 0.28rem 0.5rem; }
            /* The $TV label is implied by the page it sits on, and dropping it
               buys the width the number and change badge actually need. */
            .topbar-price .tp-label { display: none; }
            .topbar-price .tp-value { font-size: 0.88rem; }
            .topbar-price .tp-chg { font-size: 0.58rem; padding: 0.1rem 0.32rem; }
        }


        /* CARDS */
        .service-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.25rem; }
        .service-card {
            background: linear-gradient(180deg, #140B20, #0A0512 80%); border: 1px solid rgba(212,175,55,0.1); border-radius: 16px;
            padding: 1.5rem; transition: all 0.45s var(--ease-out); position: relative; overflow: hidden;
        }
        .service-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(212,175,55,0.6), transparent); opacity: 0; transition: opacity 0.45s; }
        .service-card::after { content: ''; position: absolute; inset: -30%; background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.05) 48%, rgba(212,175,55,0.07) 53%, transparent 62%); transform: translateX(-140%); pointer-events: none; }
        .service-card:hover { border-color: rgba(212,175,55,0.4); transform: translateY(-4px); box-shadow: 0 16px 44px rgba(0,0,0,0.5), 0 0 44px rgba(139,92,246,0.12); }
        .service-card:hover::before { opacity: 1; }
        .service-card:hover::after { transform: translateX(140%); transition: transform 1s ease; }
        .service-card.flash { animation: cardFlash 0.8s ease; }
        @keyframes cardFlash { 0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.6); border-color: var(--gold); } 100% { box-shadow: 0 0 0 0 transparent; border-color: rgba(255, 255, 255, 0.04); } }
        .service-card .cat-eyebrow { font-family: var(--font-mono); font-size: 0.6rem; color: var(--gold); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .service-card .cat-eyebrow::before { content: ''; width: 14px; height: 1px; background: linear-gradient(90deg, var(--gold), transparent); }
        .service-card h4 { font-size: 1.05rem; color: var(--white); font-weight: 600; margin-bottom: 0.3rem; }
        .service-card .provider-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
        .provider-avatar {
            width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-family: var(--font-mono); font-size: 0.6rem; font-weight: 600; flex-shrink: 0;
            background: linear-gradient(135deg, var(--violet), var(--magenta)); color: var(--white);
            border: 1px solid var(--gold-line); overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .provider-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .provider-name { font-size: 0.78rem; color: var(--white); font-weight: 500; }
        .verified-badge { font-size: 0.6rem; color: var(--gold); display: flex; align-items: center; gap: 0.15rem; }
        .service-card .rate-row { display: flex; align-items: baseline; gap: 0.5rem; margin: 0.75rem 0; }
        .service-card .rate { font-family: var(--font-mono); font-size: 1.4rem; font-weight: 700; }
        .service-card .rate small { font-size: 0.7rem; color: var(--silver-dim); font-weight: 400; }
        .service-card .solon-tag { font-size: 0.6rem; color: var(--violet); font-family: var(--font-mono); }
        .service-card .footer-row { display: flex; justify-content: space-between; align-items: center; padding-top: 0.75rem; border-top: 1px solid rgba(255, 255, 255, 0.04); }
        .skill-score { font-size: 0.75rem; color: var(--green); }
        .hours-left { font-size: 0.72rem; color: var(--silver-dim); font-family: var(--font-mono); }

        /* STAMP */
        .escrow-stamp {
            position: absolute; top: 1rem; right: 1rem; font-family: var(--font-display); font-size: 0.55rem;
            color: var(--gold); border: 1px solid var(--gold); padding: 0.25rem 0.5rem; border-radius: 4px;
            letter-spacing: 0.08em; transform: rotate(12deg); opacity: 0; transition: opacity 0.3s;
            pointer-events: none;
        }
        .service-card.locked .escrow-stamp { opacity: 1; animation: stampAppear 0.4s var(--ease-spring); }
        @keyframes stampAppear { 0% { transform: rotate(12deg) scale(0); opacity: 0; } 100% { transform: rotate(12deg) scale(1); opacity: 1; } }

        /* CATEGORY FILTERS */
        .cat-filters { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
        .cat-pill {
            padding: 0.45rem 1rem; border-radius: 100px; font-size: 0.75rem; cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.08);
            background: transparent; color: var(--silver-dim); font-family: var(--font-body); transition: all 0.3s;
        }
        .cat-pill:hover { border-color: var(--gold-line); color: var(--white); }
        .cat-pill.active { border-color: rgba(212,175,55,0.5); color: var(--gold); background: rgba(212,175,55,0.07); }

        /* SEARCH */
        .search-bar {
            width: 100%; padding: 0.8rem 1.25rem; border-radius: 100px; margin-bottom: 1.5rem;
            background: var(--bg-elevated); border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--white); font-family: var(--font-mono); font-size: 0.85rem; outline: none;
        }
        .search-bar:focus { border-color: rgba(212,175,55,0.45); box-shadow: 0 0 0 3px rgba(212,175,55,0.07); }
        .search-bar::placeholder { color: var(--silver-subtle); }

        /* AGENT CONSOLE */
        .agent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
        .agent-card {
            background: linear-gradient(180deg, #140B20, #0A0512 80%); border: 1px solid rgba(212,175,55,0.1); border-radius: 16px;
            padding: 1.5rem; text-align: center; cursor: pointer; transition: all 0.45s var(--ease-out); position: relative; overflow: hidden;
        }
        .agent-card::after { content: ''; position: absolute; inset: -30%; background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.05) 48%, rgba(212,175,55,0.08) 53%, transparent 62%); transform: translateX(-140%); pointer-events: none; }
        .agent-card:hover { border-color: rgba(212,175,55,0.45); transform: translateY(-4px); box-shadow: 0 14px 40px rgba(0,0,0,0.5), 0 0 40px rgba(139,92,246,0.14); }
        .agent-card:hover::after { transform: translateX(140%); transition: transform 1s ease; }
        .agent-card img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold-line); margin-bottom: 0.75rem; }
        .agent-card h4 { font-family: var(--font-display); font-size: 0.95rem; color: var(--white); }
        .agent-card .role { font-size: 0.68rem; color: var(--violet); text-transform: uppercase; letter-spacing: 0.06em; }
        .agent-lastact { font-family: var(--font-mono); font-size: 0.6rem; color: var(--silver-subtle); margin-top: 0.7rem; padding-top: 0.6rem; border-top: 1px solid rgba(212,175,55,0.08); line-height: 1.5; min-height: 2.2em; }
        .agent-lastact.bump { animation: contentIn 0.45s var(--ease-out); color: var(--gold); }
        .agent-action-row { display: flex; align-items: center; gap: 0.8rem; padding: 0.75rem 1rem; background: var(--bg-surface); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 0.5rem; cursor: pointer; transition: all 0.3s; }
        .agent-action-row:hover { border-color: var(--gold-line); box-shadow: inset 2px 0 0 var(--gold); background: rgba(139,92,246,0.06); }

    <script>
        // ============================================
        // 3D BACKGROUND: SPHERE + PARTICLES + METEORS
        // ============================================
        const bgCanvas = document.getElementById('bg3d');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ canvas: bgCanvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Fresnel sphere
        const sphereGeo = new THREE.SphereGeometry(4.5, 72, 72);
        const sphereMat = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color('#8B5CF6') } },
            vertexShader: `varying vec3 vN; varying vec3 vP; void main() { vN = normalize(normalMatrix * normal); vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `varying vec3 vN; varying vec3 vP; uniform float uTime; uniform vec3 uColor; void main() { float f = pow(1.0 - abs(dot(vN, vec3(0.0, 0.0, 1.0))), 3.8); float a = f * 0.055; a += sin(vP.x * 2.5 + uTime * 0.2) * cos(vP.y * 2.5 + uTime * 0.15) * 0.015; gl_FragColor = vec4(uColor, a); }`,
            transparent: true, depthWrite: false,
        });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat); scene.add(sphere);

        // Particles
        const pCount = 380;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(pCount * 3);
        for (let i = 0; i < pCount * 3; i += 3) {
            const r = 6 + Math.random() * 8;
            const theta = Math.random() * Math.PI * 2, phi = Math.random() * Math.PI;
            pPos[i] = r * Math.sin(phi) * Math.cos(theta);
            pPos[i + 1] = r * Math.sin(phi) * Math.sin(theta);
            pPos[i + 2] = r * Math.cos(phi);
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const pMat = new THREE.PointsMaterial({ color: '#A78BFA', size: 0.018, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending, depthWrite: false });
        const particles = new THREE.Points(pGeo, pMat); scene.add(particles);

        // Meteors

        for (let i = 0; i < 16; i++) {
            const mGeo = new THREE.PlaneGeometry(0.06, 1.8 + Math.random() * 3);
            const mCanvas = document.createElement('canvas'); mCanvas.width = 4; mCanvas.height = 64;
            const mCtx = mCanvas.getContext('2d');
            const mGrad = mCtx.createLinearGradient(0, 64, 0, 0);
            mGrad.addColorStop(0, 'rgba(139,92,246,0)'); mGrad.addColorStop(0.7, 'rgba(139,92,246,0.6)'); mGrad.addColorStop(1, 'rgba(167,139,250,1)');
            mCtx.fillStyle = mGrad; mCtx.fillRect(0, 0, 4, 64);
            const mTex = new THREE.CanvasTexture(mCanvas);
            const mMat = new THREE.MeshBasicMaterial({ map: mTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
            const meteor = new THREE.Mesh(mGeo, mMat);
            meteor.position.set((Math.random() - 0.5) * 25, (Math.random() - 0.5) * 25, -5 - Math.random() * 10);
            meteor.rotation.z = Math.PI / 4 + (Math.random() - 0.5) * 0.5;
            meteor.userData = { speed: 0.03 + Math.random() * 0.07, offset: Math.random() * 100 };

                if (m.position.x < -15 || m.position.y < -15 || m.position.z > 5) {

                const w = canvas.clientWidth, h = canvas.clientHeight;
                if (!w || !h) { setTimeout(draw, 120); return; }
                if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                ctx.strokeStyle = 'rgba(212,175,55,0.12)'; ctx.setLineDash([3, 7]);
                ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
                const pos = agents.map((n, i) => { const a = rot + i * TAU / 7 - Math.PI / 2; return { x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R }; });
                window.__constPos = pos;
                pos.forEach((p, i) => {
                    ctx.strokeStyle = `rgba(139,92,246,${(0.08 + flares[i] * 0.4).toFixed(3)})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(p.x, p.y); ctx.stroke();
                });
                for (let k = pulses.length - 1; k >= 0; k--) {
                    const pl = pulses[k]; pl.t += 0.018;
                    if (pl.t >= 1) { pulses.splice(k, 1); continue; }
                    const p = pos[pl.i], tt = pl.dir === 1 ? pl.t : 1 - pl.t;
                    const x = cx + (p.x - cx) * tt, y = cy + (p.y - cy) * tt;
                    const g = ctx.createRadialGradient(x, y, 0, x, y, 6);
                    g.addColorStop(0, 'rgba(240,218,155,0.95)'); g.addColorStop(1, 'rgba(212,175,55,0)');
                    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 6, 0, TAU); ctx.fill();
                }
                const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 95);
                glow.addColorStop(0, 'rgba(139,92,246,0.22)'); glow.addColorStop(1, 'rgba(139,92,246,0)');
                ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, 95, 0, TAU); ctx.fill();
                if (emblem.complete && emblem.naturalWidth) {
                    const breathe = 1 + Math.sin(performance.now() * 0.0018) * 0.04;
                    const eh = 92 * breathe, ew = eh * (emblem.naturalWidth / emblem.naturalHeight);
                    ctx.drawImage(emblem, cx - ew / 2, cy - eh / 2, ew, eh);
                }
                pos.forEach((p, i) => {
                    const r = 26 + flares[i] * 5;
                    if (flares[i] > 0.03) {
                        const g3 = ctx.createRadialGradient(p.x, p.y, r * 0.5, p.x, p.y, r + 20);
                        g3.addColorStop(0, `rgba(212,175,55,${(0.4 * flares[i]).toFixed(3)})`); g3.addColorStop(1, 'rgba(212,175,55,0)');
                        ctx.fillStyle = g3; ctx.beginPath(); ctx.arc(p.x, p.y, r + 20, 0, TAU); ctx.fill();
                    }
                    ctx.save(); ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.clip();
                    const im = imgs[i];
                    if (im.complete && im.naturalWidth) {
                        const s = Math.max((r * 2) / im.naturalWidth, (r * 2.6) / im.naturalHeight);
                        const iw = im.naturalWidth * s, ih = im.naturalHeight * s;
                        ctx.drawImage(im, p.x - iw / 2, p.y - r - ih * 0.04, iw, ih);
                    } else { ctx.fillStyle = '#140C1F'; ctx.fillRect(p.x - r, p.y - r, r * 2, r * 2); }
                    ctx.restore();
                    ctx.strokeStyle = flares[i] > 0.05 ? `rgba(212,175,55,${(0.5 + 0.5 * flares[i]).toFixed(3)})` : 'rgba(139,92,246,0.5)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.stroke();
                    ctx.fillStyle = flares[i] > 0.05 ? '#F0DA9B' : '#B9ABCE';
                    ctx.font = '600 9px "JetBrains Mono", monospace'; ctx.textAlign = 'center';
                    ctx.fillText(agents[i], p.x, p.y + r + 15);
                    flares[i] *= 0.96;
                });
                window.__constRAF = requestAnimationFrame(draw);
            }
            canvas.addEventListener('click', e => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left, y = e.clientY - rect.top;
                (window.__constPos || []).forEach((p, i) => { if (Math.hypot(x - p.x, y - p.y) < 32) openAgentPanelApp(agents[i]); });
            });
            canvas.addEventListener('mousemove', e => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left, y = e.clientY - rect.top;
                canvas.style.cursor = (window.__constPos || []).some(p => Math.hypot(x - p.x, y - p.y) < 32) ? 'pointer' : 'default';
            });
            draw();
        }

        // ============================================
        // LIVE TICKER
        // ============================================
        const pick = a => a[Math.floor(Math.random() * a.length)];
        const svcShort = servicesData.map(s => s.name.length > 24 ? s.name.slice(0, 22) + '…' : s.name);
        const feedTemplates = [
            () => `<span class="tk-agent gold">🔒 VORIAN</span> escrow locked · <span class="tk-val">${2 + Math.floor(Math.random() * 7)}h</span> of ${pick(svcShort)}`,
            () => `<span class="tk-agent green">✅ KAIROS</span> verified delivery · <span class="tk-val">${(92 + Math.random() * 7).toFixed(1)}%</span> confidence`,
            () => `<span class="tk-agent green">⭐ NERIS</span> updated ${pick(servicesData).pName}'s Skill Score → <span class="tk-val">${(4.4 + Math.random() * 0.6).toFixed(1)}</span>`,
            () => `<span class="tk-agent violet">✦ SOLON</span> repriced ${pick(svcShort)} → <span class="tk-val">${(0.02 + Math.random() * 0.13).toFixed(3)} $TV/hr</span>`,
            () => `<span class="tk-agent violet">🎯 ATLAS</span> matched ${pick(servicesData).pName} with <span class="tk-val">${1 + Math.floor(Math.random() * 4)} new jobs</span>`,
            () => `<span class="tk-agent gold">🏦 CIRION</span> treasury yield <span class="tk-val">+${(1 + Math.random() * 3).toFixed(1)}%</span> this epoch`,
        ];
        function buildLiveTrack() {
            const items = [];
            for (let i = 0; i < 10; i++) items.push(`<span class="tk-item">${feedTemplates[i % feedTemplates.length]()}</span><span class="tk-sep">◆</span>`);
            const half = items.join('');
            document.getElementById('liveTrack').innerHTML = half + half;
        }
        buildLiveTrack();
        setInterval(buildLiveTrack, 45000);

        // Live price drift with change indicator
        const tvBase = 0.042; let tvPrice = 0.042;
        setInterval(() => {
            tvPrice = Math.max(0.03, Math.min(0.055, tvPrice + (Math.random() - 0.5) * 0.0012));
            const chg = ((tvPrice - tvBase) / tvBase) * 100, up = chg >= 0;
            document.getElementById('livePrice').textContent = tvPrice.toFixed(4);
            const chgEl = document.getElementById('livePriceChg');
            chgEl.textContent = (up ? '▲ +' : '▼ ') + chg.toFixed(1) + '%';
            chgEl.className = 'tp-chg ' + (up ? 'up' : 'down');
        }, 2000);

        // ============================================
        // INIT
        // ============================================
        renderSection('overview');
        document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('panelOverlay').classList.remove('active'); });
    </script>
