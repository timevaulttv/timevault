<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Time Vault: X Profile Picture</title>
<style>
    :root{ --violet:#8B5CF6; --magenta:#C026D3; --gold:#D4AF37; --gold-bright:#F0DA9B; --gold-line:rgba(212,175,55,0.5); }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#111;display:flex;justify-content:center;padding:30px;}
    .pfp{position:relative;width:400px;height:400px;border-radius:50%;overflow:hidden;flex-shrink:0;
        background:
            radial-gradient(circle at 50% 40%, rgba(139,92,246,0.28), transparent 58%),
            radial-gradient(circle at 72% 24%, rgba(192,38,211,0.22), transparent 50%),
            radial-gradient(circle at 50% 50%, #170E29 0%, #0A0512 72%);}
    /* rings following the circular avatar edge */
    .ring{position:absolute;inset:10px;border-radius:50%;border:2.5px solid transparent;
        background:linear-gradient(140deg, var(--gold-bright), var(--gold) 40%, rgba(139,92,246,0.5) 70%, var(--gold)) border-box;
        -webkit-mask:linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
        box-shadow:0 0 30px rgba(139,92,246,0.35);}
    .ring2{position:absolute;inset:22px;border-radius:50%;border:1px dashed rgba(212,175,55,0.3);}
    .emblem{position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);height:250px;width:auto;z-index:3;
        filter:drop-shadow(0 8px 26px rgba(139,92,246,0.55)) drop-shadow(0 2px 10px rgba(192,38,211,0.45));}
    .tick{position:absolute;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.28em;color:var(--gold);opacity:.85;z-index:4;text-transform:uppercase;}
    .tick.b{bottom:34px;}
    .spark{position:absolute;border-radius:50%;background:#E9DEFF;z-index:2;}
</style>
</head>
<body>
<div class="pfp" id="pfp">
    <span class="spark" style="width:4px;height:4px;top:70px;left:300px;box-shadow:0 0 8px 2px rgba(180,150,255,0.7);"></span>
    <span class="spark" style="width:3px;height:3px;top:120px;left:88px;box-shadow:0 0 6px 2px rgba(180,150,255,0.6);"></span>
    <span class="spark" style="width:2px;height:2px;top:250px;left:320px;opacity:.7;"></span>
    <span class="spark" style="width:3px;height:3px;top:300px;left:110px;opacity:.7;box-shadow:0 0 6px 1px rgba(180,150,255,0.5);"></span>
    <img class="emblem" src="/assets/logo.png" alt="Time Vault">
    <span class="tick b">$TV</span>
    <div class="ring"></div>
    <div class="ring2"></div>
</div>
</body>
</html>
