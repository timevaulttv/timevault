# Rate-limit zone for the LYRA endpoint.
# limit_req_zone must live in the http{} context, so this installs to
# /etc/nginx/conf.d/timevault-lyra-zone.conf (loaded by the stock nginx.conf).
#
# The site sits behind Cloudflare, so $binary_remote_addr is a Cloudflare edge
# IP, shared by many real visitors and rotating between requests. Keying on it
# would both fail to limit an attacker and risk blocking innocent users, so key
# on the real client IP Cloudflare forwards, falling back to the socket address
# if the header is ever absent (e.g. a direct origin hit).
map $http_cf_connecting_ip $lyra_client {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

# 1 request/second sustained per real client, with a small burst allowed in the
# vhost. This is the coarse outer guard; lyra.py enforces the real hourly quota.
limit_req_zone $lyra_client zone=lyra:10m rate=1r/s;
